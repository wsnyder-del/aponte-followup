<style>
:root{--navy:#14264a;--navy2:#1e3765;--gold:#c9a24a;--gold-soft:#f7f0de;--ink:#1d2433;--muted:#5d6678;--line:#dde2ea;--bg:#f4f6f9;--card:#fff;--err:#b3261e;--ok:#1d6b3f;--warn-bg:#fff6e0;--warn-line:#e7c56b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:var(--navy);color:#fff;border-bottom:4px solid var(--gold)}
.hwrap{max-width:780px;margin:0 auto;padding:18px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:"Source Serif 4",Georgia,serif;font-weight:700;font-size:20px;letter-spacing:.2px}
.brand small{display:block;font-family:Inter,sans-serif;font-weight:500;font-size:12px;color:#c9d3e6;letter-spacing:.6px;text-transform:uppercase}
.lang{display:flex;border:1px solid rgba(255,255,255,.35);border-radius:999px;overflow:hidden;flex-shrink:0}
.lang button{background:transparent;color:#fff;border:0;padding:7px 14px;font:600 13px Inter,sans-serif;cursor:pointer}
.lang button.on{background:var(--gold);color:var(--navy)}
main{max-width:780px;margin:0 auto;padding:20px 16px 60px}
h1{font-family:"Source Serif 4",Georgia,serif;color:var(--navy);font-size:26px;line-height:1.25;margin:6px 0 10px}
.intro{color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 18px;margin:0 0 16px}
.card h2{font-family:"Source Serif 4",Georgia,serif;color:var(--navy);font-size:19px;margin:0 0 4px;display:flex;gap:10px;align-items:baseline}
.card h2 .n{color:var(--gold);font-size:15px}
.card .sub{color:var(--muted);font-size:14px;margin:0 0 12px}
.q{margin:16px 0 0}
.q label.lbl{display:block;font-weight:600;margin:0 0 6px}
.q .req{color:var(--err)}
input[type=text],input[type=email],input[type=tel],input[type=date],textarea{width:100%;border:1px solid #c7cfdb;border-radius:8px;padding:10px 12px;font:inherit;color:inherit;background:#fff}
textarea{min-height:88px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts label{display:flex;align-items:center;gap:8px;border:1px solid #c7cfdb;border-radius:8px;padding:9px 12px;cursor:pointer;background:#fff;font-weight:500}
.opts input{accent-color:var(--navy);margin:0}
.opts label.sel{border-color:var(--navy);background:#eef2f8}
.notice{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:10px;padding:12px 14px;font-size:14.5px;margin:4px 0 6px}
.notice b{color:var(--navy)}
.up{border:1px dashed #b8c2d2;border-radius:10px;padding:12px;margin:12px 0 0;background:#fafbfd}
.up .t{font-weight:600}
.up .h{color:var(--muted);font-size:13.5px;margin:2px 0 8px}
.up .pick{display:inline-block;background:var(--navy);color:#fff;border-radius:8px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer}
.up input[type=file]{display:none}
.files{list-style:none;margin:8px 0 0;padding:0}
.files li{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;padding:5px 0;border-top:1px solid var(--line);word-break:break-all}
.files button{background:none;border:0;color:var(--err);font:600 13px Inter,sans-serif;cursor:pointer;flex-shrink:0}
.ferr{color:var(--err);font-size:13.5px;margin-top:6px}
.attest{display:flex;gap:10px;align-items:flex-start;margin:14px 0 0}
.attest input{margin-top:5px;accent-color:var(--navy)}
.submit{width:100%;background:var(--gold);color:var(--navy);border:0;border-radius:10px;padding:14px;font:700 17px Inter,sans-serif;cursor:pointer;margin-top:6px}
.submit:disabled{opacity:.6;cursor:default}
.msg{margin:12px 0 0;padding:12px 14px;border-radius:10px;font-size:14.5px}
.msg.err{background:#fdecea;color:var(--err);border:1px solid #f3b8b3}
.msg.ok{background:#e8f4ec;color:var(--ok);border:1px solid #b5d9c2}
.done{text-align:center;padding:36px 18px}
.done .ck{width:56px;height:56px;border-radius:50%;background:var(--ok);color:#fff;font-size:30px;line-height:56px;margin:0 auto 12px}
.saved{color:var(--muted);font-size:13px;text-align:right;margin:-6px 0 12px;min-height:18px}
footer{text-align:center;color:var(--muted);font-size:12.5px;padding:0 16px 30px}
</style>
</head>

/* ===== STATE ===== */
let lang = 'es';
const state = {a:{}, files:{}, attest:false, sig:'', sigDate:new Date().toISOString().slice(0,10)};
UPLOADS.forEach(u=>state.files[u.id]=[]);
try{const d=JSON.parse(localStorage.getItem(DRAFT_KEY)||'null'); if(d){Object.assign(state.a,d.a||{}); state.attest=!!d.attest; state.sig=d.sig||''; if(d.sigDate)state.sigDate=d.sigDate; if(d.lang)lang=d.lang;}}catch(e){}

let saveTimer=null;
function saveDraft(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    try{localStorage.setItem(DRAFT_KEY,JSON.stringify({a:state.a,attest:state.attest,sig:state.sig,sigDate:state.sigDate,lang})); const s=document.getElementById('saved'); if(s)s.textContent=UI[lang].saved;}catch(e){}
  },400);
}

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ===== RENDER ===== */
function render(){
  const L=UI[lang];
  document.documentElement.lang=lang;
  document.getElementById('bES').classList.toggle('on',lang==='es');
  document.getElementById('bEN').classList.toggle('on',lang==='en');
  document.getElementById('brandSub').textContent=L.sub;
  document.getElementById('foot').textContent=L.foot;
  document.title='PLC | '+L.sub;

  let h=`<h1>${esc(L.title)}</h1><p class="intro">${esc(L.intro)}</p><div class="saved" id="saved"></div>`;
  SECTIONS.forEach((s,i)=>{
    h+=`<section class="card"><h2><span class="n">${i+1}</span>${esc(s[lang])}</h2>`;
    if(s.notice)h+=`<div class="notice">${s.notice[lang]}</div>`;
    s.qs.forEach(q=>{
      const v=state.a[q.id]||'';
      const star=q.req?` <span class="req" title="${L.required}">*</span>`:'';
      h+=`<div class="q"><label class="lbl" for="q_${q.id}">${esc(q[lang])}${star}</label>`;
      if(q.t==='textarea') h+=`<textarea id="q_${q.id}" data-q="${q.id}">${esc(v)}</textarea>`;
      else if(q.t==='choice'){
        h+=`<div class="opts" role="radiogroup">`+q.o.map(o=>`<label class="${v===o.v?'sel':''}"><input type="radio" name="q_${q.id}" value="${o.v}" data-q="${q.id}" ${v===o.v?'checked':''}>${esc(o[lang])}</label>`).join('')+`</div>`;
      } else h+=`<input id="q_${q.id}" type="${q.t}" data-q="${q.id}" value="${esc(v)}" ${q.t==='email'?'autocomplete="email"':''}${q.id==='name'?' autocomplete="name"':''}>`;
      h+=`</div>`;
    });
    h+=`</section>`;
  });

  const secN=SECTIONS.length+1;
  h+=`<section class="card"><h2><span class="n">${secN}</span>${lang==='es'?'Documentos':'Documents'}</h2>
      <p class="sub">${lang==='es'?'Por favor suba documentos como archivos PDF completos, no fotos. Las fotos solo están bien para daños en el techo y mensajes de texto. Si no tiene algo, déjelo vacío. <b>Los archivos no se guardan en el borrador:</b> súbalos al final, justo antes de enviar.':'Please upload documents as complete PDF files, not photos. Photos are fine only for roof damage and text messages. If you don\'t have something, leave it empty. <b>Files are not saved in your draft:</b> attach them last, right before you submit.'}</p>`;
  UPLOADS.forEach(u=>{
    h+=`<div class="up"><div class="t">${esc(u[lang])}</div>${u['h_'+lang]?`<div class="h">${esc(u['h_'+lang])}</div>`:'<div class="h"></div>'}
        <label class="pick">${L.choose}<input type="file" multiple data-up="${u.id}" accept="${u.pdf?'application/pdf,.pdf':'application/pdf,.pdf,image/*'}"></label>
        <ul class="files" id="fl_${u.id}"></ul><div class="ferr" id="fe_${u.id}"></div></div>`;
  });
  h+=`</section>`;

  h+=`<section class="card"><h2><span class="n">${secN+1}</span>${lang==='es'?'Confirmación':'Confirmation'}</h2>
      <label class="attest"><input type="checkbox" id="attest" ${state.attest?'checked':''}><span>${esc(L.attest)}</span></label>
      <div class="q"><label class="lbl" for="sig">${esc(L.sign)} <span class="req">*</span></label><input id="sig" type="text" value="${esc(state.sig)}"></div>
      <div class="q"><label class="lbl" for="sigDate">${esc(L.date)}</label><input id="sigDate" type="date" value="${esc(state.sigDate)}"></div>
      </section>
      <button class="submit" id="submit" type="button">${esc(L.submit)}</button><div id="msg"></div>`;

  document.getElementById('app').innerHTML=h;
  UPLOADS.forEach(u=>renderFiles(u.id));
  bind();
}

function renderFiles(id){
  const ul=document.getElementById('fl_'+id); if(!ul)return;
  ul.innerHTML=state.files[id].map((f,i)=>`<li><span>${esc(f.name)} · ${(f.size/1048576).toFixed(1)} MB</span><button type="button" data-rm="${id}" data-i="${i}">${UI[lang].remove}</button></li>`).join('');
  ul.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{state.files[b.dataset.rm].splice(+b.dataset.i,1);renderFiles(b.dataset.rm);});
}

function bind(){
  document.querySelectorAll('[data-q]').forEach(el=>{
    const ev=el.type==='radio'?'change':'input';
    el.addEventListener(ev,()=>{
      state.a[el.dataset.q]=el.value;
      if(el.type==='radio'){el.closest('.opts').querySelectorAll('label').forEach(l=>l.classList.toggle('sel',l.querySelector('input').checked));}
      saveDraft();
    });
  });
  document.querySelectorAll('[data-up]').forEach(inp=>inp.addEventListener('change',()=>{
    const id=inp.dataset.up, u=UPLOADS.find(x=>x.id===id), err=document.getElementById('fe_'+id); err.textContent='';
    Array.from(inp.files).forEach(f=>{
      const isPdf=f.type==='application/pdf'||/\.pdf$/i.test(f.name);
      if(u.pdf&&!isPdf){err.textContent=UI[lang].badType(f.name);return;}
      if(f.size>MAX_FILE_MB*1048576){err.textContent=UI[lang].tooBig(f.name);return;}
      state.files[id].push(f);
    });
    inp.value=''; renderFiles(id);
  }));
  const at=document.getElementById('attest'); at.onchange=()=>{state.attest=at.checked;saveDraft();};
  const sg=document.getElementById('sig'); sg.oninput=()=>{state.sig=sg.value;saveDraft();};
  const sd=document.getElementById('sigDate'); sd.oninput=()=>{state.sigDate=sd.value;saveDraft();};
  document.getElementById('submit').onclick=submit;
}

/* ===== SUBMIT ===== */
function answerText(q){
  const v=state.a[q.id]; if(!v)return '';
  if(q.t==='choice'){const o=q.o.find(x=>x.v===v); return o?`${o.es} / ${o.en}`:v;}
  return v;
}
function readB64(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=()=>rej(r.error);r.readAsDataURL(f);});}
function showMsg(t,cls){document.getElementById('msg').innerHTML=`<div class="msg ${cls}">${esc(t)}</div>`;}

async function submit(){
  const L=UI[lang], btn=document.getElementById('submit');
  const name=(state.a.name||'').trim(), email=(state.a.email||'').trim();
  if(!name||!/^\S+@\S+\.\S+$/.test(email)){showMsg(L.needName,'err');document.getElementById('q_name').scrollIntoView({behavior:'smooth',block:'center'});return;}
  if(!state.attest||!state.sig.trim()){showMsg(L.needAttest,'err');return;}
  const all=[];UPLOADS.forEach(u=>state.files[u.id].forEach(f=>all.push({u,f})));
  if(all.reduce((s,x)=>s+x.f.size,0)>MAX_TOTAL_MB*1048576){showMsg(L.tooMuch,'err');return;}

  btn.disabled=true; btn.textContent=L.reading; document.getElementById('msg').innerHTML='';

  const answers=[];
  SECTIONS.forEach(s=>s.qs.forEach(q=>answers.push({section_es:s.es,section_en:s.en,q_es:q.es,q_en:q.en,answer:answerText(q)})));

  // Backup copy of the text answers to Netlify Forms (no files)
  const plain=answers.map(a=>`[${a.section_en}] ${a.q_en}\n${a.answer||'-'}`).join('\n\n')+`\n\nSigned: ${state.sig} (${state.sigDate})`;
  try{await fetch('/',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({'form-name':'aponte-followup',name,email,lang,answers:plain}).toString()});}catch(e){}

  if(!SCRIPT_URL){btn.disabled=false;btn.textContent=L.submit;showMsg('Config: SCRIPT_URL is blank. Answers were sent to the Netlify Forms backup only.','err');return;}

  let files=[];
  try{
    for(const {u,f} of all){files.push({category_es:u.es,category_en:u.en,name:f.name,mimeType:f.type||'application/octet-stream',data:await readB64(f)});}
  }catch(e){btn.disabled=false;btn.textContent=L.submit;showMsg(L.fail,'err');return;}

  btn.textContent=L.sending;
  const payload={matter:MATTER,lang,submittedAt:new Date().toISOString(),client:{name,email,phone:state.a.phone||''},
    attestation:{confirmed:true,signature:state.sig.trim(),date:state.sigDate},answers,files};
  try{
    const r=await fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
    const j=await r.json();
    if(!j.ok)throw new Error((j.errors||[]).join('; ')||j.error||'unknown');
    try{localStorage.removeItem(DRAFT_KEY);}catch(e){}
    document.getElementById('app').innerHTML=`<section class="card done"><div class="ck">✓</div><h1>${esc(L.doneT)}</h1><p class="intro">${esc(L.doneB)}</p>${(j.errors&&j.errors.length)?`<div class="msg err">${esc(L.partial)}</div>`:''}</section>`;
    window.scrollTo(0,0);
  }catch(e){
    btn.disabled=false;btn.textContent=L.submit;showMsg(L.fail+' ('+e.message+')','err');
  }
}

document.getElementById('bES').onclick=()=>{lang='es';render();saveDraft();};
document.getElementById('bEN').onclick=()=>{lang='en';render();saveDraft();};
render();
</script>
</body>
</html>
